  <line x1="22" y1="32" x2="21.5" y2="46" stroke="#222" stroke-width="1.8"/>
  <line x1="25" y1="32" x2="25" y2="46" stroke="#222" stroke-width="1.8"/>
  <line x1="28" y1="32" x2="28.5" y2="46" stroke="#222" stroke-width="1.8"/>
