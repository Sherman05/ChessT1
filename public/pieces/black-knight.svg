<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 56">
  <!-- Риттер / Ritter - helmet shape with double lines -->
  <!-- Base -->
  <path d="M13 52 Q13 49 17 48 L33 48 Q37 49 37 52 Z" fill="#1a1a1a" stroke="#000" stroke-width="1.8"/>
  <!-- Body -->
  <path d="M17 48 L19 30 L31 30 L33 48 Z" fill="#1a1a1a" stroke="#000" stroke-width="1.8"/>
  <!-- Helmet dome -->
  <path d="M19 30 Q18 20 25 14 Q32 20 31 30 Z" fill="#1a1a1a" stroke="#000" stroke-width="1.8"/>
  <!-- Visor/plume -->
  <path d="M25 14 Q27 10 30 12" fill="none" stroke="#555" stroke-width="2"/>
  <!-- Double vertical lines (II) -->
  <line x1="23" y1="32" x2="22.5" y2="46" stroke="#555" stroke-width="1.8"/>
  <line x1="27" y1="32" x2="27.5" y2="46" stroke="#555" stroke-width="1.8"/>
</svg>
