  <!-- Top ball -->
  <circle cx="25" cy="11" r="2" fill="white" stroke="#222" stroke-width="1.5"/>
  <!-- Diagonal cross on body -->
  <line x1="22" y1="32" x2="28" y2="44" stroke="#222" stroke-width="1.2"/>
  <line x1="28" y1="32" x2="22" y2="44" stroke="#222" stroke-width="1.2"/>
