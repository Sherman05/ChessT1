<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 56">
  <!-- Вер Кнехт / Veteran - like pawn but with double lines and wider -->
  <!-- Base -->
  <path d="M14 52 Q14 49 18 48 L32 48 Q36 49 36 52 Z" fill="white" stroke="#222" stroke-width="1.8"/>
  <!-- Body - wider bell -->
  <path d="M18 48 L16 34 Q15 26 25 18 Q35 26 34 34 L32 48 Z" fill="white" stroke="#222" stroke-width="1.8"/>
  <!-- Round head with mark -->
  <circle cx="25" cy="15" r="4.5" fill="white" stroke="#222" stroke-width="1.8"/>
  <!-- Horizontal bar on head (veteran mark) -->
  <line x1="22" y1="15" x2="28" y2="15" stroke="#222" stroke-width="1.5"/>
  <!-- Double vertical lines -->
  <line x1="23" y1="24" x2="22.5" y2="46" stroke="#222" stroke-width="1.5"/>
  <line x1="27" y1="24" x2="27.5" y2="46" stroke="#222" stroke-width="1.5"/>
</svg>
