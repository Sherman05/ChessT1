<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 56">
  <!-- Кнехт / Knecht (pawn) - simple rounded shape with single line -->
  <!-- Base -->
  <path d="M15 52 Q15 49 19 48 L31 48 Q35 49 35 52 Z" fill="#1a1a1a" stroke="#000" stroke-width="1.8"/>
  <!-- Body - simple bell -->
  <path d="M19 48 L18 34 Q17 26 25 18 Q33 26 32 34 L31 48 Z" fill="#1a1a1a" stroke="#000" stroke-width="1.8"/>
  <!-- Round head -->
  <circle cx="25" cy="15" r="4" fill="#1a1a1a" stroke="#000" stroke-width="1.8"/>
  <!-- Single vertical line -->
  <line x1="25" y1="24" x2="25" y2="46" stroke="#555" stroke-width="1.5"/>
</svg>
